<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Game Selection</title>
</head>
<body>
    <h1>Welcome to the Gaming Platform</h1>
    <div id="game-selection">
        <h2>Select a Game:</h2>
        <ul>
            <li><button onclick="startGame('snake')">Snake</button></li>
            <li><button onclick="startGame('flappyBird')">Flappy Bird</button></li>
            <li><button onclick="startGame('2048')">2048</button></li>
            <li><button onclick="startGame('memoryGame')">Memory Game</button></li>
        </ul>
    </div>
    <script src="games.js"></script>
</body>
</html>
